name: Control Plane CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-control-plane:
    name: Test portable control plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          node --check src/auth.js
          node --check src/store.js
          node --check src/marketplace.js
          node --check src/billing.js
          node --check src/server.js
      - name: Run domain contract tests
        run: node --test
      - name: Build container image
        working-directory: .
        run: docker build -t multicloud-isv-control-plane:ci ./apps/control-plane
