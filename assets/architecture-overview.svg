<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Cloud ISV Marketplace Lab architecture</title>
  <desc id="desc">Client requests go through a SaaS control plane with HTTP API, metering and marketplace adapters into AWS and OCI local emulators.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071b34"/><stop offset="1" stop-color="#02101f"/></linearGradient>
    <linearGradient id="aws" x2="1"><stop stop-color="#18a9ff"/><stop offset="1" stop-color="#126ac7"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#39b9ff"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#ff6552"/></marker>
    <style>.h{font:700 46px Arial,sans-serif;fill:#fff}.t{font:700 25px Arial,sans-serif;fill:#fff}.s{font:400 18px Arial,sans-serif;fill:#acd4fa}.micro{font:600 16px Arial,sans-serif;fill:#d9edff}.box{fill:#0c2948;stroke:#36b8ff;stroke-width:2}.group{fill:#06182d;stroke-width:3;stroke-dasharray:10 8}.line{fill:none;stroke:#39b9ff;stroke-width:6;marker-end:url(#arrowBlue)}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900" stroke="#164164" stroke-width="1" opacity=".55"/>
  <text x="800" y="82" text-anchor="middle" class="h">Multi-Cloud ISV Marketplace Lab</text>
  <text x="800" y="118" text-anchor="middle" class="s">Portable SaaS control plane, validated against local cloud emulators</text>
  <rect x="60" y="350" rx="22" width="180" height="180" class="box"/>
  <circle cx="150" cy="406" r="28" fill="#39b9ff"/><path d="M104 486c8-49 84-49 92 0" fill="#39b9ff"/><text x="150" y="568" text-anchor="middle" class="t">Client</text>
  <path d="M245 440H340" class="line"/>
  <rect x="345" y="300" rx="25" width="230" height="280" class="box"/>
  <path d="M402 406c0-38 52-54 75-25 20-22 62-7 62 24 0 35-34 37-74 37h-44c-35 0-49-36-19-56Z" fill="none" stroke="#39b9ff" stroke-width="8"/><circle cx="490" cy="412" r="21" fill="#39b9ff"/>
  <text x="460" y="525" text-anchor="middle" class="t">SaaS</text><text x="460" y="555" text-anchor="middle" class="t">Control Plane</text>
  <rect x="640" y="245" rx="26" width="505" height="400" class="group" stroke="#39b9ff"/><text x="665" y="286" class="micro">Core platform services</text>
  <path d="M580 440H665" class="line"/>
  <g><rect x="675" y="330" rx="17" width="130" height="220" class="box"/><text x="740" y="423" text-anchor="middle" class="t">HTTP API</text><text x="740" y="456" text-anchor="middle" class="s">Tenants</text><text x="740" y="482" text-anchor="middle" class="s">Plans · RBAC</text></g>
  <path d="M808 440H845" class="line"/>
  <g><rect x="855" y="330" rx="17" width="150" height="220" class="box"/><text x="930" y="400" text-anchor="middle" class="t">Metering</text><text x="930" y="434" text-anchor="middle" class="s">Idempotency</text><text x="930" y="460" text-anchor="middle" class="s">Durable outbox</text><text x="930" y="486" text-anchor="middle" class="s">Retries</text></g>
  <path d="M1008 440H1030" class="line"/>
  <g><rect x="1040" y="330" rx="17" width="90" height="220" class="box"/><text x="1085" y="415" text-anchor="middle" class="t">Marketplace</text><text x="1085" y="442" text-anchor="middle" class="t">adapters</text></g>
  <path d="M1135 412H1215" class="line"/><path d="M1135 468H1215" fill="none" stroke="#ff6552" stroke-width="6" marker-end="url(#arrowRed)"/>
  <rect x="1220" y="220" rx="25" width="320" height="210" class="group" stroke="#39b9ff"/><text x="1255" y="275" class="t">AWS local</text><text x="1260" y="327" class="micro">Floci</text><text x="1350" y="327" class="micro">S3</text><text x="1410" y="327" class="micro">SQS</text><text x="1480" y="327" class="micro">DynamoDB</text><circle cx="1280" cy="360" r="16" fill="#39b9ff"/><circle cx="1365" cy="360" r="16" fill="#5ada83"/><circle cx="1430" cy="360" r="16" fill="#ff63aa"/><circle cx="1510" cy="360" r="16" fill="#a06cff"/>
  <rect x="1220" y="490" rx="25" width="320" height="180" class="group" stroke="#ff6552"/><text x="1255" y="545" class="t">OCI local</text><text x="1280" y="605" class="micro">floci-oci</text><text x="1410" y="605" class="micro">Object Storage</text><circle cx="1320" cy="625" r="18" fill="#ff6552"/><ellipse cx="1465" cy="618" rx="26" ry="14" fill="none" stroke="#ff6552" stroke-width="7"/>
  <rect x="350" y="770" rx="28" width="900" height="64" fill="#0c2948" stroke="#246697" stroke-width="2"/><text x="800" y="810" text-anchor="middle" class="micro">Local emulator validation only • No commercial marketplace operations</text>
</svg>